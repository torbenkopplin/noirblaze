# noirblaze -- GENERATED by build/emit from palette.toml. Do not edit.
#
# The 16 ANSI slots plus the basics, for a kitty with no Noctalia. Include it
# from kitty.conf:
#
#     include /path/to/noirblaze/dist/kitty-colors.conf
#
# On a desktop running Noctalia this file is NOT what you want -- the palette is
# rendered from dist/noirblaze.json through Noctalia's template engine, so that
# a scheme change repaints terminals that are already open. See the README.
#
# Profile 'aa': WCAG 2.2 AA: 4.5:1 for text, 3:1 for non-text
# Solved at T = 36, the composited background over a backdrop of 153.
#
# Transparency is deliberately NOT set here. background_opacity belongs to
# whatever owns the glass level on your machine, and setting it from a colour
# file would fight that. dist/glass.conf.sample has the recommended number.

foreground            #d5d5d5
background            #121212

cursor                #ff0088
cursor_text_color     #121212

# Upstream's selection, and the same values dist/noirblaze.json carries: a light
# backing with the theme's own background as the text. These two artefacts have
# to agree, or a standalone kitty and a Noctalia one disagree about what a
# selection looks like -- which they did, #b0b0b0 against #323232.
selection_foreground  #121212
selection_background  #b0b0b0

url_color             #ff0088

# normal
color0   #121212
color1   #ff0088
color2   #00ff77
color3   #ffffff
color4   #b0b0b0
color5   #8b8b8b
color6   #8b8b8b
color7   #d5d5d5

# bright
color8   #8b8b8b
color9   #fd319e
color10  #2eff8f
color11  #fdfdfd
color12  #bebebe
color13  #939393
color14  #919191
color15  #f5f5f5

active_border_color   #ff0088
# Solved as a SURFACE, not taken raw. These are opaque cells drawn against a
# translucent background, exactly like Visual and Pmenu in the editor: bg3 as
# written is 1.21:1 against the composited background where the palette declares
# 1.461. See decision 006.
inactive_border_color #3a3a3a

active_tab_foreground   #121212
active_tab_background   #ff0088
inactive_tab_foreground #d5d5d5
inactive_tab_background #3a3a3a
