# noirblaze -- GENERATED by build/emit from palette.toml. Do not edit.
#
# The 16 ANSI slots plus the basics, for a kitty with no Noctalia. Include it
# from kitty.conf:
#
#     include /path/to/noirblaze/dist/kitty-colors.conf
#
# On a desktop running Noctalia this file is NOT what you want -- the palette is
# rendered from dist/noirblaze.json through Noctalia's template engine, so that
# a scheme change repaints terminals that are already open. See the README.
#
# Profile 'aa': WCAG 2.2 AA: 4.5:1 for text, 3:1 for non-text
# Solved at T = 36, the composited background over a backdrop of 153.
#
# Transparency is deliberately NOT set here. background_opacity belongs to
# whatever owns the glass level on your machine, and setting it from a colour
# file would fight that. dist/glass.conf.sample has the recommended number.

foreground            #d5d5d5
background            #121212

cursor                #ff0088
cursor_text_color     #121212

selection_foreground  #d5d5d5
selection_background  #323232

url_color             #ff0088

# normal
color0   #121212
color1   #ff0088
color2   #00ff77
color3   #ffffff
color4   #b0b0b0
color5   #8b8b8b
color6   #8b8b8b
color7   #d5d5d5

# bright
color8   #8b8b8b
color9   #fd319e
color10  #2eff8f
color11  #fdfdfd
color12  #bebebe
color13  #939393
color14  #919191
color15  #f5f5f5

active_border_color   #ff0088
inactive_border_color #323232

active_tab_foreground   #121212
active_tab_background   #ff0088
inactive_tab_foreground #d5d5d5
inactive_tab_background #323232
